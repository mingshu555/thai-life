name: ThaiLife
options:
  bundleIdPrefix: com.yaohuix
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "V67ZQWB5H3"
    CODE_SIGN_STYLE: "Automatic"

targets:
  ThaiLife:
    type: application
    platform: iOS
    sources:
      - path: ThaiLife
        excludes:
          - Resources/Audio
          - Resources/ThaiMenu
          - Resources/LooplessSignage
          - Resources/Fonts
          - Resources/Attributions
      - path: ThaiLife/Resources/Audio
        type: folder
      - path: ThaiLife/Resources/ThaiMenu
        type: folder
      - path: ThaiLife/Resources/LooplessSignage
        type: folder
      - path: ThaiLife/Resources/Fonts
        type: folder
      - path: ThaiLife/Resources/Attributions
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yaohuix.ThaiLife
        DEVELOPMENT_TEAM: "V67ZQWB5H3"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "泰会记"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        INFOPLIST_KEY_UIAppFonts:
          - "Fonts/Sarabun-Regular.ttf"
          - "Fonts/Prompt-Regular.ttf"
    dependencies: []
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    # entitlements:
    #   path: ThaiLife/ThaiLife.entitlements
    #   properties:
    #     com.apple.developer.icloud-container-identifiers:
    #       - iCloud.com.yaohuix.ThaiLife
    #     com.apple.developer.icloud-services:
    #       - CloudKit
    #     aps-environment: development

  ThaiLifeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThaiLifeTests
    dependencies:
      - target: ThaiLife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.yaohuix.ThaiLifeTests
